[project]
name = "four-g-phone-mcp"
version = "0.1.0"
description = "MCP server for controlling a 4G USB modem (Huawei E3372/E8372) over the Balong HTTP API"
authors = [{ name = "Sandra Schipal", email = "sandra@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.34,<1",
    "prefab-ui>=0.14.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/four_g_phone_mcp"]
